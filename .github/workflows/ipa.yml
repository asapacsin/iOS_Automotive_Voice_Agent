name: ipa
# Builds an unsigned NovaDrive.ipa for sideloading (Sideloadly / AltStore re-sign it with an Apple ID).
on:
  push:
  workflow_dispatch:
jobs:
  unsigned-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec App/project.yml
      - run: |
          xcodebuild -project App/NovaDrive.xcodeproj -scheme NovaDrive -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NovaDrive.app Payload/
          zip -qry NovaDrive.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NovaDrive-ipa
          path: NovaDrive.ipa
