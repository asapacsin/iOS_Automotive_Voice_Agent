name: ci
# Manual only (owner rule 2026-10-27: no automatic CI, it used up the Actions minutes).
# Start with: gh workflow run ci.yml --ref <branch>
# Owner rule 2026-10-27: no macOS runners (billed 10x). scripts/gates/check_runners.py enforces it.
on:
  workflow_dispatch:
jobs:
  core-linux:
    runs-on: ubuntu-24.04
    container: swift:6.0.3-noble
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y python3
      - run: scripts/gates/run_all.sh
