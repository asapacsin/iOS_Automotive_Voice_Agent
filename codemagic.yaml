
workflows:
  novadrive-ios:
    name: NovaDrive iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 20

    environment:
      xcode: latest

    scripts:
      - name: Generate Xcode project
        script: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate --spec App/project.yml

      - name: Build unsigned iPhone app
        script: |
          set -o pipefail
          xcodebuild \
            -project App/NovaDrive.xcodeproj \
            -scheme NovaDrive \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Package unsigned IPA
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NovaDrive.app Payload/
          zip -qry NovaDrive-unsigned.ipa Payload

    artifacts:
      - NovaDrive-unsigned.ipa
      - xcodebuild.log
