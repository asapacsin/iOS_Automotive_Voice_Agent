
workflows:
  novadrive-ios:
    name: NovaDrive iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 20

    environment:
      xcode: latest

    # Kept between builds: DerivedData (unchanged packages are not recompiled) and SwiftPM's cache.
    cache:
      cache_paths:
        - $CM_BUILD_DIR/build
        - $HOME/Library/Caches/org.swift.swiftpm

    scripts:
      # F-05a §12 item 3 / F-08 §14 item 2: sherpa-onnx xcframeworks and models, pinned and checksummed.
      - name: Fetch sherpa-onnx libraries and models
        script: |
          set -e
          scripts/fetch_sherpa_libs.sh
          scripts/fetch_sherpa_models.sh

      - name: Generate Xcode project
        script: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate --spec App/project.yml

      - name: Build unsigned iPhone app
        script: |
          set -o pipefail
          # F-13a §10 item 1 (T-032i): the build stamp shown in 设置 and the record header.
          NOVA_GIT_COMMIT="${CM_COMMIT:-$(git rev-parse HEAD)}"
          xcodebuild \
            -project App/NovaDrive.xcodeproj \
            -scheme NovaDrive \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            NOVA_GIT_COMMIT="${NOVA_GIT_COMMIT:0:7}" \
            build 2>&1 | tee xcodebuild.log

      - name: Package unsigned IPA
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NovaDrive.app Payload/
          zip -qry NovaDrive-unsigned.ipa Payload

    artifacts:
      - NovaDrive-unsigned.ipa
      - xcodebuild.log
