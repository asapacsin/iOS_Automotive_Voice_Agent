# XcodeGen spec for the device test app. CI runs `xcodegen generate` (.github/workflows/ipa.yml).
name: NovaDrive
options:
  deploymentTarget:
    iOS: "18.0"
packages:
  NovaCore:
    path: ../Packages/NovaCore
  NovaServices:
    path: ../Packages/NovaServices
  NovaAudio:
    path: ../Packages/NovaAudio
  NovaRealtime:
    path: ../Packages/NovaRealtime
  NovaPlatform:
    path: ../Packages/NovaPlatform
targets:
  NovaDrive:
    type: application
    platform: iOS
    sources: [NovaDrive]
    info:
      path: NovaDrive/Info.plist
      properties:
        UIFileSharingEnabled: true
    dependencies:
      - package: NovaCore
        product: NovaKit
      - package: NovaCore
        product: NovaPorts
      - package: NovaCore
        product: NovaTools
      - package: NovaCore
        product: NovaVoice
      - package: NovaCore
        product: NovaNav
      - package: NovaCore
        product: NovaAgent
      - package: NovaServices
        product: NovaServices
      - package: NovaAudio
        product: NovaAudio
      - package: NovaRealtime
        product: NovaRealtime
      - package: NovaPlatform
        product: NovaPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asapacsin.novadrive
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nova Drive
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Nova Drive listens to your voice commands.
        INFOPLIST_KEY_NSCameraUsageDescription: Nova Drive 需要用摄像头回答你关于画面的问题。
        INFOPLIST_KEY_NSContactsUsageDescription: Nova Drive 需要读取通讯录，才能按名字帮你打电话。
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
