# XcodeGen spec for the device test app. CI runs `xcodegen generate` (.github/workflows/ipa.yml).
name: NovaDrive
options:
  deploymentTarget:
    iOS: "18.0"
packages:
  NovaCore:
    path: ../Packages/NovaCore
  NovaServices:
    path: ../Packages/NovaServices
  NovaAudio:
    path: ../Packages/NovaAudio
  NovaRealtime:
    path: ../Packages/NovaRealtime
  NovaPlatform:
    path: ../Packages/NovaPlatform
  NovaAsrSherpa:
    path: ../Packages/NovaAsrSherpa
targets:
  NovaDrive:
    type: application
    platform: iOS
    sources:
      - path: NovaDrive
        excludes: [SherpaModels, SherpaModels/**]
      # F-05a §12 / F-08 §14: fetched by scripts/fetch_sherpa_models.sh (not in git); bundled as SherpaModels/.
      - path: NovaDrive/SherpaModels
        type: folder
        buildPhase: resources
        optional: true
    info:
      path: NovaDrive/Info.plist
      properties:
        UIFileSharingEnabled: true
        # F-23 / OQ-IOS-4: used only while a voice session or route guidance is active (review notes).
        # `location` is added with the CoreLocation provider; the demo route needs no background fix.
        UIBackgroundModes: [audio]
        # F-04b §12 (T-013f): the speaker model is an Apple-hosted asset pack (iOS 26+), downloaded at install.
        BAAppGroupID: group.com.asapacsin.novadrive
        BAHasManagedAssetPacks: true
        BAUsesAppleHosting: true
    entitlements:
      path: NovaDrive/NovaDrive.entitlements
      properties:
        com.apple.security.application-groups: [group.com.asapacsin.novadrive]
    dependencies:
      - target: NovaDriveAssets
      - package: NovaCore
        product: NovaKit
      - package: NovaCore
        product: NovaPorts
      - package: NovaCore
        product: NovaTools
      - package: NovaCore
        product: NovaVoice
      - package: NovaCore
        product: NovaNav
      - package: NovaCore
        product: NovaAgent
      - package: NovaServices
        product: NovaServices
      - package: NovaAudio
        product: NovaAudio
      - package: NovaRealtime
        product: NovaRealtime
      - package: NovaPlatform
        product: NovaPlatform
      - package: NovaAsrSherpa
        product: NovaAsrSherpa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asapacsin.novadrive
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nova Drive
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Nova Drive listens to your voice commands.
        INFOPLIST_KEY_NSCameraUsageDescription: Nova Drive 需要用摄像头回答你关于画面的问题。
        INFOPLIST_KEY_NSContactsUsageDescription: Nova Drive 需要读取通讯录，才能按名字帮你打电话。
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Nova Drive 用你的位置搜索附近的地点、规划路线和查询当地天气。
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # T-060 AIKit wake SDK: device-only and git-ignored (scripts/vendor_aikit.sh). Found only by device
        # builds, so `#if canImport(AIKIT)` is false on the simulator and when the SDK is absent.
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": $(inherited) $(SRCROOT)/Vendor/AIKit
        "LD_RUNPATH_SEARCH_PATHS": $(inherited) @executable_path/Frameworks
      configs:
        # F-04b §12 item 3: Debug keeps the fetch-script speaker model; Release (App Store / TestFlight) gets it
        # from the install-time asset pack instead.
        Debug:
          NOVA_BUNDLE_SPEAKER_MODEL: YES
        Release:
          NOVA_BUNDLE_SPEAKER_MODEL: NO
    postBuildScripts:
      - name: Strip bundled speaker model (Release)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          # Archives only (App Store / TestFlight): sideloaded `build` IPAs keep the model (no asset pack for them).
          [ "$NOVA_BUNDLE_SPEAKER_MODEL" = "NO" ] && [ "$ACTION" = "install" ] || exit 0
          rm -rf "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/SherpaModels/speaker"
      - name: Embed AIKit (device, when vendored)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          src="$SRCROOT/Vendor/AIKit"
          [ "$PLATFORM_NAME" = "iphoneos" ] && [ -d "$src/AIKIT.framework" ] || exit 0
          dest="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$dest"
          for fw in "$src"/*.framework; do
            rm -rf "$dest/$(basename "$fw")"
            cp -R "$fw" "$dest/"
            rm -rf "$dest/$(basename "$fw")/Headers" "$dest/$(basename "$fw")/Modules"
            if [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
              codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --preserve-metadata=identifier,entitlements "$dest/$(basename "$fw")"
            fi
          done
          rm -rf "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/AEEResource.bundle"
          cp -R "$src/AEEResource.bundle" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
  NovaDriveAssets:
    # F-04b §12 item 7 (T-013f): Apple's managed Background Assets downloader for the speaker model pack.
    # ExtensionKit (EXAppExtensionAttributes), embedded in Extensions/; the BA* keys are on the app only.
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources: [NovaDriveAssets]
    entitlements:
      path: NovaDriveAssets/NovaDriveAssets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.asapacsin.novadrive]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asapacsin.novadrive.assets
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: NovaDriveAssets/Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
  NovaDriveUITests:
    # T-048: simulator drive (scripted search and engine); CI job `simulator`.
    type: bundle.ui-testing
    platform: iOS
    sources: [NovaDriveUITests]
    dependencies:
      - target: NovaDrive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asapacsin.novadrive.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  NovaDriveTests:
    # F-16a row 6: adapter unit tests with a fake CLLocationManager; CI job `simulator`.
    type: bundle.unit-test
    platform: iOS
    sources: [NovaDriveTests]
    dependencies:
      - target: NovaDrive
      - package: NovaCore
        product: NovaKit
      - package: NovaCore
        product: NovaPorts
      - package: NovaPlatform
        product: NovaPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asapacsin.novadrive.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  NovaDrive:
    build:
      targets:
        NovaDrive: all
        NovaDriveTests: [test]
        NovaDriveUITests: [test]
    test:
      targets: [NovaDriveTests, NovaDriveUITests]
